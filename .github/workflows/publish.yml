on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install system dependencies
        run: sudo apt-get install -y libglpk-dev

      - name: Install downlit
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::downlit any::xml2 any::rmarkdown any::tidymodels any::BiocManager

      - name: Install mixOmics
        # mixOmics is a Bioconductor package referenced in code that
        # R/post-render-downlit.R links against; it must be loadable for
        # downlit to resolve its function references, even though this
        # workflow otherwise relies on the committed freeze cache.
        run: Rscript -e 'install.packages("mixOmics", repos = BiocManager::repositories(), dependencies = TRUE)'

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          QUARTO_PROFILE: production
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}